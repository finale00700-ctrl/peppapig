<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: blueprint worksheet (Chinese, navy + red) — header with play-all, legend, numbered rows: 뜻 → 성조 한글 발음 → 汉字·병음 → 단어 */
:root{
  --bg:#f5f7fb; --paper:#ffffff; --grid:#e0e5ef; --ink:#14243f; --muted:#5d6a82;
  --navy:#173a6b; --accent:#c8312b; --accent-soft:#fbeceb; --line:#ccd5e3; --now:#fff6dc;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1729; --paper:#12213a; --grid:#1b2d4b; --ink:#e6edf7; --muted:#9aaccb;
  --navy:#8fb3ea; --accent:#f0706a; --accent-soft:#33191b; --line:#2a3f62; --now:#2c2a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1729; --paper:#12213a; --grid:#1b2d4b; --ink:#e6edf7; --muted:#9aaccb;
  --navy:#8fb3ea; --accent:#f0706a; --accent-soft:#33191b; --line:#2a3f62; --now:#2c2a18; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ko);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;padding:0 16px;padding-block:28px 48px}
.sheet{max-width:860px;margin:0 auto;background:var(--paper);border:1.5px solid var(--navy);position:relative;padding:28px 28px 20px}
.sheet::before,.sheet::after{content:"";position:absolute;width:18px;height:18px;border:3px solid var(--accent)}
.sheet::before{top:-6px;left:-6px;border-right:0;border-bottom:0}
.sheet::after{bottom:-6px;right:-6px;border-left:0;border-top:0}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
h1{margin:4px 0 0;font-size:28px;font-weight:900;color:var(--navy);text-wrap:balance}
h1 .zhT{font-family:var(--f-zh);margin-right:8px}
.meta{display:grid;gap:6px;justify-items:end;font-size:13px;color:var(--muted)}
.all{display:flex;gap:6px;flex-wrap:wrap}
.all button{font-size:13px;font-weight:700;padding:6px 12px}
.all .go{background:var(--accent);border-color:var(--accent);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 4px;font-size:13px;color:var(--muted)}
.legend b{font-family:var(--f-mono);color:var(--accent);font-size:16px;margin-right:4px}
.legend .t b{color:var(--navy)}
.how{font-size:13px;color:var(--muted);margin:4px 0 8px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:34px 1fr minmax(120px,170px);gap:4px 14px;padding:14px 8px;border-bottom:1px dashed var(--line);align-items:start;transition:background .2s}
li.now{background:var(--now)}
.num{font-family:var(--f-mono);font-weight:700;color:var(--accent);font-size:15px;padding-top:16px}
.body{min-width:0;display:grid;gap:4px}
.ko{font-size:14px;color:var(--muted)}
.ph{font-size:22px;font-weight:700;color:var(--ink);line-height:1.9;word-break:keep-all}
.ph i{font-style:normal;color:var(--accent);font-family:var(--f-mono);font-weight:700}
ruby{ruby-position:over}
rt{font-size:15px;color:var(--navy);font-weight:700;line-height:1}
.zh{font-family:var(--f-zh);font-size:18px;color:var(--navy);font-weight:500}
.py{font-family:var(--f-mono);font-size:13px;color:var(--navy);opacity:.85}
.tts{display:flex;gap:4px;margin-top:4px}
.voc{border-left:2px solid var(--line);padding-left:10px;display:grid;gap:3px;font-size:13px;align-content:start;min-width:0}
.voc span{font-family:var(--f-zh);color:var(--accent);font-weight:700;margin-right:4px}
button{font-family:var(--f-ko);font-size:12px;border:1px solid var(--navy);background:transparent;color:var(--navy);padding:4px 10px;cursor:pointer}
button:hover{background:var(--navy);color:var(--paper)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.warn{font-size:12px;color:var(--accent);margin:4px 0 0}
footer{margin-top:14px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
li.sc{display:block;padding:18px 0 6px;border-bottom:2px solid var(--navy)}
li.sc b{font-size:12px;color:var(--accent);letter-spacing:.08em;margin-right:8px}
li.sc span{font-size:18px;font-weight:900;color:var(--navy)}
li.sc span i{font-family:var(--f-zh);font-style:normal;color:var(--accent);font-size:15px;margin-left:8px}
.chk{justify-self:start;font-size:12px;background:var(--now);color:var(--accent);padding:2px 8px}
@media (max-width:600px){
  .sheet{padding:20px 14px}
  li{grid-template-columns:28px 1fr;padding:12px 4px}
  .voc{grid-column:2;border-left:0;padding-left:0;display:flex;flex-wrap:wrap;gap:4px 12px}
  .ph{font-size:20px}
  .meta{justify-items:start}
}
@media (prefers-reduced-motion: reduce){li{transition:none}}
</style>
</head>

const hasTTS = "speechSynthesis" in window;
const warn = () => { document.getElementById("warn").hidden = false; };
if (!hasTTS) warn();
let zhVoice = null;
function pickVoice(){
  try{ const v = speechSynthesis.getVoices();
    zhVoice = v.find(x=>x.lang==="zh-CN") || v.find(x=>/^zh/i.test(x.lang) && !/HK|TW/i.test(x.lang)) || null; }catch(e){}
}
if (hasTTS){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }

let queueToken = 0;
function mark(i){
  document.querySelectorAll("#list li.s").forEach((li,k)=>li.classList.toggle("now", k===i));
}
function say(text, rate, onend){
  if (!hasTTS){ warn(); return; }
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; if (zhVoice) u.voice = zhVoice; u.rate = rate;
    if (onend) u.onend = onend;
    u.onerror = () => { if (onend) onend(); };
    speechSynthesis.speak(u);
  }catch(e){ warn(); }
}
function stopAll(){ queueToken++; try{ speechSynthesis.cancel(); }catch(e){} mark(-1); }
function playOne(i, rate){
  stopAll(); mark(i);
  const t = queueToken;
  say(S[i].zh, rate, () => { if (t === queueToken) mark(-1); });
}
function playFrom(i, rate){
  if (i >= S.length){ mark(-1); return; }
  const t = queueToken; mark(i);
  const li = document.querySelectorAll("#list li.s")[i];
  try{ li.scrollIntoView({block:"center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }catch(e){}
  say(S[i].zh, rate, () => { if (t !== queueToken) return; setTimeout(()=>{ if (t === queueToken) playFrom(i+1, rate); }, 900); });
}
document.getElementById("playAll").onclick = () => { stopAll(); playFrom(0, 0.9); };
document.getElementById("playAllSlow").onclick = () => { stopAll(); playFrom(0, 0.6); };
document.getElementById("stop").onclick = stopAll;

const list = document.getElementById("list");
S.forEach((s,i)=>{
  if (s.scene){ const h = document.createElement("li"); h.className = "sc";
    h.innerHTML = `<b>${s.scene.split(" · ")[0]}</b><span>${s.scene.split(" · ")[1]}<i>${s.sceneZh}</i></span>`; list.appendChild(h); }
  const li = document.createElement("li"); li.className = "s";
  li.innerHTML = `<div class="num">${s.num}</div>
   <div class="body"><div class="ko">${s.ko}</div><div class="ph">${s.ph}</div>
   <div><span class="zh">${s.zh}</span> <span class="py">${s.py}</span></div>${s.chk ? `<div class="chk">※ ${s.chk}</div>` : ""}
   <div class="tts"><button type="button" data-r="0.9">▶ 보통</button><button type="button" data-r="0.6">▶ 천천히</button></div></div>
   <div class="voc">${s.v.map(([z,m])=>`<div><span>${z}</span>${m}</div>`).join("")}</div>`;
  li.querySelectorAll("button").forEach(b => b.onclick = () => playOne(i, +b.dataset.r));
  list.appendChild(li);
});
</script>
