<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페파피그방</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
:root{--bg:#f5f7fb;--paper:#fff;--grid:#e0e5ef;--ink:#14243f;--muted:#5d6a82;--navy:#173a6b;--accent:#c8312b;--line:#ccd5e3;--soft:#fbeceb}
@media (prefers-color-scheme: dark){:root{--bg:#0c1729;--paper:#12213a;--grid:#1b2d4b;--ink:#e6edf7;--muted:#9aaccb;--navy:#8fb3ea;--accent:#f0706a;--line:#2a3f62;--soft:#33191b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;padding:28px 16px 48px;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:640px;margin:0 auto;background:var(--paper);border:1.5px solid var(--navy);padding:28px 24px}
.eb{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
h1{margin:4px 0 6px;font-size:30px;font-weight:900;color:var(--navy)}
p{color:var(--muted);font-size:14px;margin:0 0 18px}
.ep{border-top:2px solid var(--navy);padding-top:14px;margin-top:10px}
.ep h2{margin:0 0 10px;font-size:18px;color:var(--navy)}
.ep h2 span{font-family:"Noto Sans SC",sans-serif;color:var(--accent);margin-right:6px}
a.btn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;margin-bottom:8px;border:1px solid var(--line);
  text-decoration:none;color:var(--ink);font-weight:700;font-size:16px;background:var(--paper)}
a.btn:hover,a.btn:focus-visible{background:var(--soft);border-color:var(--accent);outline:none}
a.btn small{color:var(--muted);font-weight:400;font-size:13px}
.soon{padding:14px 16px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
footer{margin-top:20px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eb">한글로중국어 · MI Music</div>
  <h1>페파피그방</h1>
  <p>영상으로 보고, 성조 한글 발음으로 따라 말해요. 크롬이나 삼성 인터넷에서 열어야 소리가 나와요.</p>

  <section class="ep">
    <h2><span>泥坑</span>1화 진흙탕</h2>
    <a class="btn" href="01-easy.html">1부 · 쉬운 문장 <small>30문장 ▶</small></a>
  </section>

  <footer>내 입으로 연습한 소리만 내 귀에 들립니다</footer>
</div>
</body>
</html>
